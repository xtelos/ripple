[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-code"
version = "0.1.0"
description = "An MCP server that tells a coding agent what breaks before it edits Python, TypeScript, JavaScript, Go, Rust or Java code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dylan Fodor" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# TypeScript indexing. Nothing in the base install imports these: the parser is loaded when the first
# .ts file is parsed. tree-sitter 0.25 and 0.26 both read the grammar's ABI 14. The grammar has had one
# release line since 2024 and is held to it, as a newer tree-sitter core could stop accepting its ABI.
typescript = ["tree-sitter>=0.25,<0.27", "tree-sitter-typescript>=0.23.2,<0.24"]
# Go indexing, loaded the same way. tree-sitter-go 0.25 is ABI 15, which tree-sitter 0.25 and 0.26 both read, so one
# core serves both grammars. The grammar is held to the 0.25 line the node and field names were written against.
go = ["tree-sitter>=0.25,<0.27", "tree-sitter-go>=0.25,<0.26"]
# Rust indexing, likewise loaded only when the first .rs file is parsed. tree-sitter-rust 0.24 is ABI 15, which both
# tree-sitter 0.25 and 0.26 read; the grammar is held to the 0.24 line whose node shapes the front end reads. Cargo.toml
# is read with tomllib, which the standard library has from Python 3.11.
rust = ["tree-sitter>=0.25,<0.27", "tree-sitter-rust>=0.24.2,<0.25", "tomli>=2; python_version < '3.11'"]
# Java indexing, on the same terms: its grammar is ABI 14 too, and has had one release line (0.23) since 2024.
java = ["tree-sitter>=0.25,<0.27", "tree-sitter-java>=0.23.5,<0.24"]

[project.scripts]
ripple = "ripple.cli:main"

[tool.setuptools]
packages = ["ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
