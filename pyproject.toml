[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-code"
version = "0.1.0"
description = "An MCP server that tells a coding agent what breaks before it edits Python or TypeScript code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dylan Fodor" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# TypeScript indexing. Nothing in the base install imports these: the parser is loaded when the first
# .ts file is parsed. tree-sitter 0.25 and 0.26 both read the grammar's ABI 14. The grammar has had one
# release line since 2024 and is held to it, as a newer tree-sitter core could stop accepting its ABI.
typescript = ["tree-sitter>=0.25,<0.27", "tree-sitter-typescript>=0.23.2,<0.24"]

[project.scripts]
ripple = "ripple.cli:main"

[tool.setuptools]
packages = ["ripple"]

[tool.pytest.ini_options]
testpaths = ["tests"]
