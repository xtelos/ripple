name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # "dev" is the base install: the tests of every optional language must skip there, and everything else must pass.
        # "dev,typescript" adds the optional parser, so the TypeScript and JavaScript tests and the benchmark run.
        # "dev,typescript,go,rust,java" adds Go's, Rust's and Java's, so their tests run beside the others (they skip without them).
        extras: ["dev", "dev,typescript", "dev,typescript,go,rust,java"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      # The live Maven tests (tests/test_check_java_live.py) run a real `mvn -o` against a local repository that must
      # already hold JUnit, JMH and the plugins. The jobs with the java extra fill one here (Maven Central, through
      # Maven, nothing else) and keep it between runs, keyed on the Maven in use and on the fixture poms that pin the versions.
      - name: Maven version (names the live Maven cache)
        id: maven
        if: contains(matrix.extras, 'java')
        run: |
          mvn -v
          echo "version=$(mvn -v | sed -n '1s/^Apache Maven \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Live Maven cache
        id: m2
        if: contains(matrix.extras, 'java')
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ripple-m2
          key: ripple-m2-${{ runner.os }}-mvn${{ steps.maven.outputs.version }}-${{ hashFiles('tests/fixtures/java_check/projects/**/pom.xml', 'ci/warm-maven.sh') }}
      - name: Fill the live Maven cache (only on a cache miss)
        if: contains(matrix.extras, 'java') && steps.m2.outputs.cache-hit != 'true'
        run: sh ci/warm-maven.sh "${{ runner.temp }}/ripple-m2"
      # The live Gradle tests (tests/test_check_gradle_live.py on Gradle 9.9.1, test_check_gradle_live8.py on 8.10.2 and
      # test_check_gradle_live_junit4.py on both) run a real `gradle --offline`. ci/warm-gradle.sh installs both Gradles (from
      # services.gradle.org, each checked against its pinned SHA-256 before it is unpacked), a Gradle user home for each that
      # holds JUnit 5.11.3, and JUnit 4.13.2 with hamcrest-core into the Maven repository above (RIPPLE_TEST_M2, which the
      # live Maven tests share). The install is cached right after it is filled, not at the end of the job: the tests write
      # into these homes (a wrapper unpacks a distribution there), and a cache saved after them would be gigabytes.
      # Gradle 9.9.1 and the Maven tests run on the job's default JDK (the failed first run of this wiring showed it is JDK 25 on
      # the current image). Gradle 8.10.2 dies on a JDK newer than 23 ("Unsupported class file major version 69"), so its builds
      # and tests run on the image's JDK 21. The runner exports it as JAVA_HOME_21_X64 (images: Ubuntu 24.04 and 26.04 list it);
      # the environment variables of the image are not in the `env` context, so a step copies it into GITHUB_ENV, and fails here,
      # by name, if the image ever lacks it. The java -version lines say which JDK each build uses.
      - name: JDKs for the live Gradle tests (Gradle 8 gets JDK 21)
        if: contains(matrix.extras, 'java')
        run: |
          echo "default JDK: JAVA_HOME=${JAVA_HOME:-unset}"
          java -version
          env | grep '^JAVA_HOME' | sort || true
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            echo "::error::the runner image has no JDK 21 (JAVA_HOME_21_X64 is '${JAVA_HOME_21_X64:-}'), which the live Gradle 8 tests need"
            exit 1
          fi
          echo "Gradle 8 JDK: JAVA_HOME_21_X64=${JAVA_HOME_21_X64}"
          "${JAVA_HOME_21_X64}/bin/java" -version
          echo "RIPPLE_TEST_GRADLE8_JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - name: Live Gradle cache
        id: gradle
        if: contains(matrix.extras, 'java')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ripple-gradle
          key: ripple-gradle-${{ runner.os }}-gradle9.9.1-gradle8.10.2-junit5.11.3-junit4.13.2-${{ hashFiles('ci/warm-gradle.sh', 'ci/warm-gradle/**') }}
      - name: Fill the live Gradle install (only on a cache miss)
        if: contains(matrix.extras, 'java') && steps.gradle.outputs.cache-hit != 'true'
        run: sh ci/warm-gradle.sh "${{ runner.temp }}/ripple-gradle" "${{ runner.temp }}/ripple-m2"
      - name: Save the live Gradle install (only on a cache miss, only after it was filled)
        if: contains(matrix.extras, 'java') && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ripple-gradle
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      # The Gradle 9 modules take the `gradle` on PATH, and the runner image ships one: ours goes first.
      - name: Put the live Gradle 9.9.1 first on PATH
        if: contains(matrix.extras, 'java')
        run: |
          echo "${{ runner.temp }}/ripple-gradle/gradle-9.9.1/bin" >> "$GITHUB_PATH"
          "${{ runner.temp }}/ripple-gradle/gradle-9.9.1/bin/gradle" --version
          JAVA_HOME="${RIPPLE_TEST_GRADLE8_JAVA_HOME}" "${{ runner.temp }}/ripple-gradle/gradle-8.10.2/bin/gradle" --version
      # RIPPLE_REQUIRE_LIVE_MAVEN=1 and RIPPLE_REQUIRE_LIVE_GRADLE=1 make the live Maven and Gradle tests fail, instead of skip,
      # when no JDK, build tool or cache is found. They are set only in the jobs that install the java extra, so the other
      # four skip them as before (the paths below do not exist there). RIPPLE_TEST_GRADLE8_JAVA_HOME (JDK 21, set above through
      # GITHUB_ENV) is what the Gradle 8 tests run on; the other Gradle tests use the default JDK.
      - name: Tests
        run: python -m pytest -q -rs
        env:
          RIPPLE_TEST_M2: ${{ runner.temp }}/ripple-m2
          RIPPLE_REQUIRE_LIVE_MAVEN: ${{ contains(matrix.extras, 'java') && '1' || '' }}
          RIPPLE_TEST_GRADLE_HOME: ${{ runner.temp }}/ripple-gradle/home9
          RIPPLE_TEST_GRADLE8: ${{ runner.temp }}/ripple-gradle/gradle-8.10.2/bin/gradle
          RIPPLE_TEST_GRADLE8_HOME: ${{ runner.temp }}/ripple-gradle/home8
          RIPPLE_TEST_GRADLE_DIST: ${{ runner.temp }}/ripple-gradle/dl/gradle-9.9.1-bin.zip
          RIPPLE_REQUIRE_LIVE_GRADLE: ${{ contains(matrix.extras, 'java') && '1' || '' }}
      - name: Benchmark (fails if precision or recall drops below bench/baseline.json)
        run: python -m bench
      - name: TypeScript benchmark (fails if below bench/baseline_ts.json; needs the typescript extra)
        if: contains(matrix.extras, 'typescript')
        run: python -m bench.ts_score
