name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # "dev" is the base install: the tests of every optional language must skip there, and everything else must pass.
        # "dev,typescript" adds the optional parser, so the TypeScript and JavaScript tests and the benchmark run.
        # "dev,typescript,go,rust,java" adds Go's, Rust's and Java's, so their tests run beside the others (they skip without them).
        extras: ["dev", "dev,typescript", "dev,typescript,go,rust,java"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      # The live Maven tests (tests/test_check_java_live.py) run a real `mvn -o` against a local repository that must
      # already hold JUnit, JMH and the plugins. The jobs with the java extra fill one here (Maven Central, through
      # Maven, nothing else) and keep it between runs, keyed on the Maven in use and on the fixture poms that pin the versions.
      - name: Maven version (names the live Maven cache)
        id: maven
        if: contains(matrix.extras, 'java')
        run: |
          mvn -v
          echo "version=$(mvn -v | sed -n '1s/^Apache Maven \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Live Maven cache
        id: m2
        if: contains(matrix.extras, 'java')
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ripple-m2
          key: ripple-m2-${{ runner.os }}-mvn${{ steps.maven.outputs.version }}-${{ hashFiles('tests/fixtures/java_check/projects/**/pom.xml', 'ci/warm-maven.sh') }}
      - name: Fill the live Maven cache (only on a cache miss)
        if: contains(matrix.extras, 'java') && steps.m2.outputs.cache-hit != 'true'
        run: sh ci/warm-maven.sh "${{ runner.temp }}/ripple-m2"
      # RIPPLE_REQUIRE_LIVE_MAVEN=1 makes the live Maven tests fail, instead of skip, when no JDK, Maven or cache is found.
      # It is set only in the jobs that install the java extra, so the other four skip them as before.
      - name: Tests
        run: python -m pytest -q -rs
        env:
          RIPPLE_TEST_M2: ${{ runner.temp }}/ripple-m2
          RIPPLE_REQUIRE_LIVE_MAVEN: ${{ contains(matrix.extras, 'java') && '1' || '' }}
      - name: Benchmark (fails if precision or recall drops below bench/baseline.json)
        run: python -m bench
      - name: TypeScript benchmark (fails if below bench/baseline_ts.json; needs the typescript extra)
        if: contains(matrix.extras, 'typescript')
        run: python -m bench.ts_score
